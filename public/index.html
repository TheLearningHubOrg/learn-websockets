<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn WebSockets - Live RFC 6455 Testbench</title>
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-card: rgba(18, 26, 43, 0.75);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      padding: 2rem 1rem;
      background: rgba(18, 26, 43, 0.9);
      border-radius: 14px;
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    p { color: var(--text-secondary); }

    .status-badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .status-badge.connected { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .status-badge.disconnected { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .log-window {
      background: #060910;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      height: 320px;
      overflow-y: auto;
      padding: 1rem;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.88rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .log-line { line-height: 1.4; word-break: break-all; }
    .log-line.system { color: #94a3b8; font-style: italic; }
    .log-line.chat { color: #38bdf8; }
    .log-line.broadcast { color: #f59e0b; font-weight: 600; }
    .log-line.pong { color: #10b981; }

    .controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    input, select, button {
      background: #0d1527;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
    }

    input:focus { outline: none; border-color: var(--accent); }

    button {
      background: var(--accent);
      color: #0b111e;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }
    button.secondary { background: #1e293b; color: white; border: 1px solid var(--border-color); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div id="status-indicator" class="status-badge disconnected">Disconnected</div>
      <h1>Learn WebSockets Live Testbench</h1>
      <p>Interactive RFC 6455 Duplex Protocol Client</p>
    </header>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
        <span style="font-weight: 600; color: #94a3b8;">Real-Time Message Log</span>
        <div style="display: flex; gap: 0.5rem;">
          <button class="secondary" id="ping-btn">Ping (RTT)</button>
          <button class="secondary" id="clear-btn">Clear Log</button>
        </div>
      </div>

      <div class="log-window" id="log-window"></div>

      <form id="msg-form" class="controls">
        <select id="room-select">
          <option value="general">#general</option>
          <option value="architecture">#architecture</option>
          <option value="concurrency">#concurrency</option>
        </select>
        <input type="text" id="msg-input" placeholder="Type a real-time message..." style="flex: 1;" required autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script>
    const wsUrl = `ws://${window.location.host}`;
    let socket;
    let pingStart = 0;

    const statusEl = document.getElementById('status-indicator');
    const logEl = document.getElementById('log-window');
    const formEl = document.getElementById('msg-form');
    const inputEl = document.getElementById('msg-input');
    const roomSelect = document.getElementById('room-select');
    const pingBtn = document.getElementById('ping-btn');
    const clearBtn = document.getElementById('clear-btn');

    function log(message, type = 'system') {
      const line = document.createElement('div');
      line.className = `log-line ${type}`;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function connect() {
      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        statusEl.className = 'status-badge connected';
        statusEl.textContent = 'Connected (RFC 6455)';
        log('Connection established with WebSocket server.', 'system');
      };

      socket.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'pong') {
            const rtt = Date.now() - pingStart;
            log(`PONG received from server. RTT Latency: ${rtt}ms`, 'pong');
          } else if (msg.type === 'chat') {
            log(`[${msg.room}] <${msg.sender}>: ${msg.payload}`, 'chat');
          } else if (msg.type === 'broadcast') {
            log(`[GLOBAL BROADCAST] <${msg.sender}>: ${msg.payload}`, 'broadcast');
          } else {
            log(`${msg.payload || JSON.stringify(msg)}`, 'system');
          }
        } catch {
          log(event.data, 'system');
        }
      };

      socket.onclose = () => {
        statusEl.className = 'status-badge disconnected';
        statusEl.textContent = 'Disconnected';
        log('Connection closed. Reconnecting in 3 seconds...', 'system');
        setTimeout(connect, 3000);
      };

      socket.onerror = (err) => {
        log('WebSocket connection error.', 'system');
      };
    }

    connect();

    formEl.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text || socket.readyState !== WebSocket.OPEN) return;

      socket.send(JSON.stringify({
        type: 'chat',
        payload: text
      }));
      inputEl.value = '';
    });

    roomSelect.addEventListener('change', () => {
      if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          type: 'join',
          room: roomSelect.value
        }));
      }
    });

    pingBtn.addEventListener('click', () => {
      if (socket.readyState === WebSocket.OPEN) {
        pingStart = Date.now();
        socket.send(JSON.stringify({ type: 'ping' }));
      }
    });

    clearBtn.addEventListener('click', () => {
      logEl.innerHTML = '';
    });
  </script>
</body>
</html>
